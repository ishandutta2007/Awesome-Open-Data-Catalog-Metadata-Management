<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradient for Highlights -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>

    <style>
      .title {
        font: bold 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        fill: #ffffff;
      }
      .subtitle {
        font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        fill: #94a3b8;
      }
      .badge-text {
        font: bold 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        fill: #38bdf8;
      }
      .pill-text {
        font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        fill: #cbd5e1;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      .floating {
        animation: float 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Banner Background Card -->
  <rect width="800" height="200" rx="15" fill="url(#bannerGrad)" stroke="#312e81" stroke-width="1.5" />

  <!-- Dynamic Glowing Mesh Grid Dots & Orbs in Background -->
  <g opacity="0.35">
    <circle cx="80" cy="40" r="1.5" fill="#38bdf8" />
    <circle cx="140" cy="40" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="40" r="1.5" fill="#38bdf8" />
    <circle cx="680" cy="40" r="1.5" fill="#c084fc" />
    <circle cx="740" cy="40" r="1.5" fill="#c084fc" />
    <circle cx="80" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="140" cy="160" r="1.5" fill="#38bdf8" />
    <circle cx="680" cy="160" r="1.5" fill="#c084fc" />
    <circle cx="740" cy="160" r="1.5" fill="#c084fc" />
  </g>

  <!-- Dynamic Animated Background Orbs / Flow Elements (Kept safely in background) -->
  <circle cx="710" cy="55" r="35" fill="#6366f1" opacity="0.25">
    <animate attributeName="r" values="30;42;30" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite" />
  </circle>

  <circle cx="740" cy="135" r="50" fill="#38bdf8" opacity="0.15">
    <animate attributeName="r" values="45;55;45" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="60" cy="140" r="45" fill="#818cf8" opacity="0.12">
    <animate attributeName="r" values="40;50;40" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Connecting Line Pattern with Flow Pulsing -->
  <path d="M 620 60 Q 670 95 720 70 T 770 120" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Foreground Group: Content & Typography (Never covered or obscured) -->
  <g transform="translate(48, 32)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="190" height="22" rx="11" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15" class="badge-text" letter-spacing="0.5">OPEN METADATA ECOSYSTEM</text>

    <!-- Main Title with Subtle Dynamic Floating Animation -->
    <g class="floating">
      <text x="0" y="58" class="title">Awesome Open Data Catalog</text>
      <text x="0" y="94" class="title" fill="#e2e8f0">&amp; Metadata Management</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="124" class="subtitle">Curated SaaS Platforms, Iceberg REST Catalogs &amp; Active Lineage</text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="95" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="14" class="pill-text">🔍 Discovery</text>

      <rect x="105" y="0" width="88" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="115" y="14" class="pill-text">⛓️ Lineage</text>

      <rect x="203" y="0" width="108" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="213" y="14" class="pill-text">🛡️ Governance</text>

      <rect x="321" y="0" width="118" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="331" y="14" class="pill-text">⚡ Iceberg REST</text>
    </g>
  </g>
</svg>
